services:
  - type: web
    name: byronz-api
    runtime: python
    rootDir: backend
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    disk:
      name: byronz-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BYRONZ_LLM_PROVIDER
        value: openai_compatible
      - key: OPENAI_COMPATIBLE_BASE_URL
        value: https://api.llama.com/compat/v1/
      - key: OPENAI_COMPATIBLE_DEFAULT_MODEL
        value: meta-llama/llama-4-maverick-17b-128e-instruct
      - key: OPENAI_COMPATIBLE_MODELS
        value: meta-llama/llama-4-maverick-17b-128e-instruct|Llama 4 Maverick,meta-llama/llama-4-scout-17b-16e-instruct|Llama 4 Scout
      - key: LLAMA_API_KEY
        sync: false
      - key: BYRONZ_DB_PATH
        value: /var/data/chat.db
      - key: CORS_ALLOWED_ORIGINS
        value: capacitor://localhost,http://localhost,http://127.0.0.1
      - key: TRUSTED_HOSTS
        value: "*"
