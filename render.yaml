services:
  - type: web
    name: byronz-api
    runtime: python
    rootDir: backend
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    disk:
      name: byronz-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BYRONZ_LLM_PROVIDER
        value: groq
      - key: OPENAI_COMPATIBLE_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_COMPATIBLE_DEFAULT_MODEL
        value: openai/gpt-oss-20b
      - key: OPENAI_COMPATIBLE_MODELS
        value: openai/gpt-oss-20b,llama-3.1-8b-instant,qwen/qwen3-32b,llama-3.3-70b-versatile
      - key: OPENAI_COMPATIBLE_API_KEY
        sync: false
      - key: BYRONZ_DB_PATH
        value: /var/data/chat.db
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false
