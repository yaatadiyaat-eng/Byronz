services:
  ollama:
    image: ollama/ollama:latest
    container_name: byronz-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  byronz-api:
    build: .
    container_name: byronz-api
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8000:8000"

volumes:
  ollama_data:
