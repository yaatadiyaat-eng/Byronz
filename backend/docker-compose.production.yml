services:
  ollama:
    image: ollama/ollama:latest
    container_name: byronz-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  byronz-api:
    build: .
    container_name: byronz-api
    restart: unless-stopped
    depends_on:
      - ollama
    env_file:
      - .env.production
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      BYRONZ_DB_PATH: ${BYRONZ_DB_PATH:-/var/data/chat.db}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://api.domain-anda.com,capacitor://localhost,http://localhost,http://127.0.0.1}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-api.domain-anda.com,localhost,127.0.0.1}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - byronz_data:/var/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; payload=json.loads(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read().decode('utf-8')); raise SystemExit(0 if payload.get('status') == 'ok' else 1)"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  ollama_data:
  byronz_data:
